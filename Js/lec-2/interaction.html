<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaction</title>
    <script>
        function alertExample(){
            alert("hellow");
        }
        function promptExample(){
            let name = prompt("Enter Your Name","Harshil");
            alert(name)
        }
        function confirmExample(){
            let flag = confirm("Delete?");
            alert(flag)
        }
    </script>
</head>
<body>
    <button onclick="alertExample()">alertExample</button>
    <button onclick="promptExample()">promptExample</button>
    <button onclick="confirmExample()">confirmExample</button>
</body>
</html>
